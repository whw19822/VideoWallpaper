plugins {
    id "com.android.application"
}

def releaseSigningFile = rootProject.file("keystore.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    System.getenv(environmentName) ?: releaseSigning.getProperty(propertyName)
}
def releaseStoreFile = signingValue("storeFile", "VIDEO_WALLPAPER_STORE_FILE")
def releaseStorePassword = signingValue(
        "storePassword",
        "VIDEO_WALLPAPER_STORE_PASSWORD"
)
def releaseKeyAlias = signingValue("keyAlias", "VIDEO_WALLPAPER_KEY_ALIAS")
def releaseKeyPassword = signingValue(
        "keyPassword",
        "VIDEO_WALLPAPER_KEY_PASSWORD"
)
def releaseSigningReady = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def configuredVersionCode = providers.gradleProperty("appVersionCode").getOrElse("1")
def configuredVersionName = providers.gradleProperty("appVersionName").getOrElse("1.0.0")

android {
    namespace = "com.whw.videowallpaper"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.whw.videowallpaper"
        minSdk = 29
        targetSdk = 37
        versionCode = Integer.parseInt(configuredVersionCode)
        versionName = configuredVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        disable += "AndroidGradlePluginVersion"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                    "Release signing is not configured. Run "
                            + "./scripts/generate-release-keystore.sh or provide the "
                            + "VIDEO_WALLPAPER_* signing environment variables."
            )
        }
        if (!rootProject.file(releaseStoreFile).isFile()) {
            throw new GradleException(
                    "Release keystore does not exist: " + releaseStoreFile
            )
        }
    }
}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    dependsOn(tasks.named("verifyReleaseSigning"))
}
